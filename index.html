<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>声调大冒险 — 第三声</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b;background:#f4f7fb}
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px}
.app{width:min(100%,560px);background:#fff;border-radius:30px;padding:22px;box-shadow:0 18px 60px rgba(23,33,43,.12)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;gap:11px;align-items:center}.micIcon{width:46px;height:46px;border-radius:50%;background:#eaf4ff;display:grid;place-items:center;font-size:24px}
.brand small{display:block;color:#718096;margin-top:2px}.badge{padding:9px 14px;border-radius:999px;background:#eaf3ff;color:#2563eb;font-weight:800}
.word{text-align:center;margin:8px 0 0;font-size:58px;font-weight:900}.pinyin{text-align:center;font-size:24px;font-weight:850}
.hint{text-align:center;color:#667085;margin:6px 0 16px;font-weight:600}
.game{position:relative;height:330px;border-radius:25px;overflow:hidden;background:linear-gradient(#dff4ff 0%,#effaff 57%,#e8f8ea 100%);border:1px solid #d9e7ef}
.skyCloud{position:absolute;width:88px;height:35px;border-radius:50px;background:rgba(255,255,255,.8);top:36px;left:28px;filter:blur(.2px)}
.hills{position:absolute;left:-5%;right:-5%;bottom:-32px;height:115px;border-radius:50% 50% 0 0;background:rgba(118,205,123,.28);transform:rotate(-2deg)}
svg{position:absolute;inset:0;width:100%;height:100%}
.guideBand{fill:none;stroke:#c9dcff;stroke-width:78;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
.guide{fill:none;stroke:#4f7ff0;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 13}
.progress{fill:none;stroke:#7aa2ff;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:.38}
.panda{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;display:grid;place-items:center;font-size:37px;background:#fff;box-shadow:0 7px 18px rgba(0,0,0,.15);will-change:left,top;transition:left .05s linear,top .09s ease-out}
.finish{position:absolute;right:7%;top:23%;font-size:35px}.axis{position:absolute;left:12px;color:#64748b;font-weight:800;font-size:13px}.axis.high{top:26%}.axis.mid{top:49%}.axis.low{top:72%}
.status{position:absolute;right:16px;top:16px;background:rgba(234,243,255,.94);color:#2563eb;padding:8px 12px;border-radius:999px;font-weight:800;font-size:13px}
.coach{margin-top:14px;background:#edf6ff;color:#2563eb;border-radius:18px;padding:13px 15px;text-align:center;font-weight:800;min-height:48px}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}button{border:0;border-radius:17px;padding:15px 20px;font-size:17px;font-weight:850;cursor:pointer}.primary{background:#17212b;color:white}.secondary{background:#eef2f6;color:#17212b}
.tip{text-align:center;color:#718096;font-size:13px;margin:14px 6px 2px}.privacy{text-align:center;color:#a0aec0;font-size:11px;margin-top:10px}
.live{background:#ecfdf3;color:#067647}.warn{background:#fff7ed;color:#b54708}
@media(max-width:410px){.app{padding:16px;border-radius:22px}.game{height:300px}.word{font-size:50px}.actions{grid-template-columns:1fr}.secondary{display:none}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="brand"><div class="micIcon">🎙️</div><div><strong>声调大冒险</strong><small>用声音带着熊猫跑一跑！</small></div></div>
    <span id="micBadge" class="badge">第三声</span>
  </div>
  <div class="word">马</div>
  <div class="pinyin">mǎ · 第三声</div>
  <div class="hint">声音先降，再到低点，最后上升 ∨</div>

  <section class="game">
    <div class="skyCloud"></div><div class="hills"></div>
    <span class="axis high">高</span><span class="axis mid">中</span><span class="axis low">低</span>
    <svg viewBox="0 0 1000 600" preserveAspectRatio="none" aria-label="第三声引导轨道">
      <path class="guideBand" d="M125 190 C310 205 430 420 565 430 C700 440 815 245 925 190"/>
      <path id="progress" class="progress" d="M125 190 C310 205 430 420 565 430 C700 440 815 245 925 190" pathLength="100"/>
      <path class="guide" d="M125 190 C310 205 430 420 565 430 C700 440 815 245 925 190"/>
    </svg>
    <div id="status" class="status">跟着蓝线走就好！</div>
    <div id="panda" class="panda">🐼</div>
    <div class="finish">🏁</div>
  </section>

  <div id="coach" class="coach">准备好后，按开始练习，然后说「mǎ——」</div>
  <div class="actions">
    <button id="startBtn" class="primary">🎙️ 开始练习</button>
    <button id="resetBtn" class="secondary">↻ 再试一次</button>
  </div>
  <div class="tip">💡 不用完全一样。大致呈现「降 → 低 → 升」就很好！</div>
  <div class="privacy">🔒 声音只在你的浏览器里分析，不会上传录音。</div>
</main>

<script>
const panda=document.getElementById('panda');
const startBtn=document.getElementById('startBtn');
const resetBtn=document.getElementById('resetBtn');
const micBadge=document.getElementById('micBadge');
const coach=document.getElementById('coach');
const statusEl=document.getElementById('status');
const progress=document.getElementById('progress');

let audioCtx, analyser, stream, raf, buffer, running=false;
let startTime=0, smoothMidi=null, baseline=null, samples=[], voicedStart=null, lastPitch=null;

// Key UX rule:
// The learner's voice does NOT draw a literal black trace.
// The blue curve is the "road". Voice only nudges the panda smoothly
// above/below that road. If the broad contour is right, the panda stays near it.
function hzToMidi(hz){ return 69+12*Math.log2(hz/440); }

function autoCorrelate(buf,sampleRate){
  let rms=0;
  for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  if(rms<0.014) return -1;
  const minLag=Math.floor(sampleRate/480), maxLag=Math.min(Math.floor(sampleRate/75),buf.length-2);
  let bestLag=-1,best=0;
  for(let lag=minLag;lag<=maxLag;lag++){
    let c=0,n=buf.length-lag;
    for(let i=0;i<n;i++) c+=buf[i]*buf[i+lag];
    c/=n;
    if(c>best){best=c;bestLag=lag;}
  }
  if(bestLag<0) return -1;
  let norm=0;
  for(let i=0;i<buf.length-bestLag;i++) norm+=(buf[i]*buf[i]+buf[i+bestLag]*buf[i+bestLag])*.5;
  norm/=buf.length-bestLag;
  if(norm<=0 || best/norm<.58) return -1;
  return sampleRate/bestLag;
}

// Same broad curve as the blue road. Screen y: larger means lower.
function roadY(t){
  t=Math.max(0,Math.min(1,t));
  if(t<.55){
    const u=t/.55, s=u*u*(3-2*u);
    return .315 + .405*s;
  }
  const u=(t-.55)/.45, s=u*u*(3-2*u);
  return .72 - .405*s;
}

function reset(){
  running=false; cancelAnimationFrame(raf);
  smoothMidi=null; baseline=null; samples=[]; voicedStart=null; lastPitch=null;
  panda.style.left='12.5%'; panda.style.top='31.5%';
  progress.style.strokeDasharray='100';
  progress.style.strokeDashoffset='100';
  statusEl.textContent='跟着蓝线走就好！';
  coach.textContent='准备好后，按开始练习，然后说「mǎ——」';
  startBtn.disabled=false; startBtn.textContent='🎙️ 开始练习';
  micBadge.textContent='第三声'; micBadge.className='badge';
}

function evaluate(){
  if(samples.length<12){
    coach.textContent='我还没听清楚，再说一次「mǎ——」';
    statusEl.textContent='再来一次';
    return;
  }
  const vals=samples.map(s=>s.m);
  const n=vals.length;
  const head=vals.slice(0,Math.max(3,Math.floor(n*.2)));
  const tail=vals.slice(-Math.max(3,Math.floor(n*.2)));
  const start=head.reduce((a,b)=>a+b,0)/head.length;
  const end=tail.reduce((a,b)=>a+b,0)/tail.length;
  let min=Infinity, idx=0;
  vals.forEach((v,i)=>{if(v<min){min=v;idx=i;}});
  const fall=start-min, rise=end-min, valley=idx/Math.max(1,n-1);

  // Broad linguistic contour, deliberately forgiving.
  if(fall>1.25 && rise>1.0 && valley>.22 && valley<.88){
    statusEl.textContent='✨ 第三声！';
    coach.textContent='很好！你做出了「降 → 低 → 升」的感觉。';
  }else if(fall<=1.25){
    statusEl.textContent='差一点';
    coach.textContent='下一次只做一件事：先让声音往下走一点 ↓';
  }else if(rise<=1.0){
    statusEl.textContent='差一点';
    coach.textContent='已经降下来了！到低点以后，再自然往上 ↗';
  }else{
    statusEl.textContent='很接近';
    coach.textContent='很好，再让转折稍微自然一点就可以。';
  }
}

function loop(){
  if(!running) return;
  analyser.getFloatTimeDomainData(buffer);
  const hz=autoCorrelate(buffer,audioCtx.sampleRate);

  if(hz>0){
    let midi=hzToMidi(hz);

    // Ignore obvious octave glitches instead of displaying them.
    if(lastPitch!==null && Math.abs(midi-lastPitch)>6.5) midi=lastPitch;
    lastPitch=midi;

    // Strong smoothing: learner sees a game character, not an oscilloscope.
    smoothMidi=smoothMidi===null?midi:(smoothMidi*.93+midi*.07);

    if(voicedStart===null){
      voicedStart=performance.now();
      startTime=voicedStart;
      baseline=smoothMidi;
    }

    const elapsed=(performance.now()-startTime)/3000;
    const t=Math.max(0,Math.min(1,elapsed));
    const x=.125+t*.80;
    const target=roadY(t);

    // Voice influences only a modest offset around the blue road.
    // This makes the panda visually "follow the road" while still responding
    // to whether the learner is moving down/up in the expected direction.
    const delta=smoothMidi-baseline;
    const voiceY=Math.max(.12,Math.min(.88,.315-delta/10.5));
    const offset=Math.max(-.09,Math.min(.09,(voiceY-target)*.30));
    const displayY=target+offset;

    panda.style.left=(x*100)+'%';
    panda.style.top=(displayY*100)+'%';
    progress.style.strokeDashoffset=String(100-t*100);
    samples.push({m:smoothMidi,t});

    // Gentle real-time coaching based on broad phase, not exact pitch.
    if(t<.48){
      statusEl.textContent='慢慢降下来 ↘';
    }else if(t<.65){
      statusEl.textContent='到低点了 ✓';
    }else{
      statusEl.textContent='现在往上 ↗';
    }

    if(t>=1){
      running=false;
      evaluate();
      startBtn.disabled=false;
      startBtn.textContent='🎙️ 再说一次';
      micBadge.textContent='完成 ✓';
      return;
    }
  }
  raf=requestAnimationFrame(loop);
}

async function start(){
  try{
    if(!stream){
      if(!navigator.mediaDevices?.getUserMedia) throw new Error('browser');
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      await audioCtx.resume();
      const src=audioCtx.createMediaStreamSource(stream);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
      buffer=new Float32Array(analyser.fftSize);
    }
    reset();
    running=true;
    micBadge.textContent='● 正在听'; micBadge.className='badge live';
    coach.textContent='说「mǎ——」：不用追线，正常说就好。';
    statusEl.textContent='开始！';
    startBtn.disabled=true; startBtn.textContent='正在聆听…';
    loop();
  }catch(e){
    micBadge.textContent='麦克风未开启'; micBadge.className='badge warn';
    coach.textContent='请允许浏览器使用麦克风，然后再试一次。';
  }
}

startBtn.addEventListener('click',start);
resetBtn.addEventListener('click',reset);
reset();
</script>
</body>
</html>
