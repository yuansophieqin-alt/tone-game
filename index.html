<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>声调大冒险 · 句子模式</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#15202b;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px}
.app{width:min(100%,720px);background:#fff;border-radius:30px;padding:22px;box-shadow:0 18px 60px rgba(20,32,43,.12)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;font-size:21px}.sub{font-size:12px;color:#7b8794;margin-top:3px}.badge{background:#eaf3ff;color:#2563eb;border-radius:999px;padding:9px 14px;font-weight:850}
.sentence{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:22px 0 16px}
.word{min-width:62px;text-align:center;padding:7px 6px;border-radius:14px;transition:.15s}.word .py{display:block;font-size:13px;color:#718096;font-weight:700;margin-bottom:2px}.word .hz{display:block;font-size:25px;font-weight:900}.word.active{background:#eaf3ff;color:#1d4ed8;transform:translateY(-2px)}.word.active .py{color:#4777df}.punct{min-width:auto}
.game{height:350px;position:relative;overflow:hidden;border:1px solid #dbe8ef;border-radius:25px;background:linear-gradient(#def4ff,#effaff 62%,#eaf8e9)}
svg{position:absolute;inset:0;width:100%;height:100%}.lane{stroke:#d8e9ff;stroke-width:70;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#4f7ff0;stroke-width:7;fill:none;stroke-dasharray:12 13;stroke-linecap:round;stroke-linejoin:round}.progress{stroke:#7aa2ff;stroke-width:12;opacity:.35;fill:none;stroke-linecap:round;stroke-linejoin:round}
.axis{position:absolute;left:11px;color:#64748b;font-size:13px;font-weight:850}.high{top:18%}.mid{top:47%}.low{top:76%}
.panda,.dragon{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:36px;box-shadow:0 7px 18px rgba(0,0,0,.14);will-change:left,top}.dragon{font-size:34px;transition:left .04s linear,top .04s linear}.panda{transition:left .04s linear,top .08s ease-out}
.finish{position:absolute;right:4%;top:18%;font-size:32px}.userTrace{fill:none;stroke:#25a65a;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.badTrace{fill:none;stroke:#ef4444;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.phaseTabs{display:flex;gap:8px;justify-content:center;margin:0 0 12px}.phase{padding:7px 11px;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:12px;font-weight:850}.phase.on{background:#eaf3ff;color:#2563eb}.status{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.85);padding:8px 11px;border-radius:999px;color:#2563eb;font-size:12px;font-weight:850}
.coach{margin-top:13px;background:#edf6ff;color:#2563eb;border-radius:18px;padding:13px;text-align:center;font-weight:850;min-height:48px}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:13px}button{border:0;border-radius:17px;padding:15px 20px;font-size:16px;font-weight:850}.primary{background:#17212b;color:white}.secondary{background:#eef2f6;color:#17212b}
.tip{text-align:center;color:#718096;font-size:13px;margin-top:13px}.privacy{text-align:center;color:#a0aec0;font-size:11px;margin-top:8px}.voiceNote{text-align:center;color:#64748b;font-size:12px;margin-top:8px}
@media(max-width:520px){.app{padding:16px}.game{height:315px}.word{min-width:52px}.word .hz{font-size:22px}.sentence{gap:3px}.actions{grid-template-columns:1fr}.secondary{display:none}}
</style>
</head>
<body>
<main class="app">
 <div class="top"><div><div class="brand">🎙️ 声调大冒险</div><div class="sub">句子模式 · 自然语流 · 高 / 中 / 低三档</div></div><div id="badge" class="badge">整句练习</div></div>

 <div id="sentence" class="sentence">
   <div class="word"><span class="py">ní</span><span class="hz">你</span></div>
   <div class="word"><span class="py">hǎo</span><span class="hz">好</span></div>
   <div class="word punct"><span class="py">&nbsp;</span><span class="hz">，</span></div>
   <div class="word"><span class="py">wǒ</span><span class="hz">我</span></div>
   <div class="word"><span class="py">jiào</span><span class="hz">叫</span></div>
   <div class="word"><span class="py">Xiǎo</span><span class="hz">小</span></div>
   <div class="word"><span class="py">Mǎ</span><span class="hz">马</span></div>
   <div class="word punct"><span class="py">&nbsp;</span><span class="hz">。</span></div>
 </div>

 <div class="phaseTabs"><span id="demoTab" class="phase on">① 小龙示范</span><span id="practiceTab" class="phase">② 熊猫跟读</span></div>
 <section class="game">
   <span class="axis high">高</span><span class="axis mid">中</span><span class="axis low">低</span>
   <svg viewBox="0 0 1000 600" preserveAspectRatio="none">
     <!-- Simplified sentence contour: broad three-level road, not literal F0 -->
     <path class="lane" d="M95 330 C125 315 155 245 190 205 C220 260 240 395 275 420 C305 410 335 385 365 405 C395 415 425 400 455 390 C485 220 515 185 540 190 C565 235 590 350 620 415 C650 390 680 300 710 245 C740 215 770 205 800 220 C825 270 845 405 875 425 C900 425 920 390 935 350"/>
     <path id="progress" class="progress" pathLength="100" d="M95 330 C125 315 155 245 190 205 C220 260 240 395 275 420 C305 410 335 385 365 405 C395 415 425 400 455 390 C485 220 515 185 540 190 C565 235 590 350 620 415 C650 390 680 300 710 245 C740 215 770 205 800 220 C825 270 845 405 875 425 C900 425 920 390 935 350"/>
     <path id="goodTrace" class="userTrace" d=""/><path id="badTrace" class="badTrace" d=""/><path id="road" class="guide" pathLength="100" d="M95 330 C125 315 155 245 190 205 C220 260 240 395 275 420 C305 410 335 385 365 405 C395 415 425 400 455 390 C485 220 515 185 540 190 C565 235 590 350 620 415 C650 390 680 300 710 245 C740 215 770 205 800 220 C825 270 845 405 875 425 C900 425 920 390 935 350"/>
   </svg>
   <div id="status" class="status">跟着句子走</div>
   <div id="dragon" class="dragon">🐲</div><div id="panda" class="panda" style="display:none">🐼</div><div class="finish">🏁</div>
 </section>

 <div id="coach" class="coach">按开始后，连续说：「你好，我叫小马。」</div>
 <div class="actions"><button id="start" class="primary">▶️ 小龙先示范</button><button id="reset" class="secondary">↻ 再来一次</button></div>
 <div class="tip">💡 先看小龙沿蓝线示范整句高低变化；再轮到你。熊猫实时记录你的声音：接近目标显示绿色，明显偏离显示红色。</div>
 <div id="voiceNote" class="voiceNote">🔊 小龙会用浏览器的中文语音示范。</div>
 <div class="privacy">🔒 你的声音只在浏览器中分析，不上传录音。</div>
</main>
<script>
const panda=document.querySelector('#panda'),dragon=document.querySelector('#dragon'),road=document.querySelector('#road'),
progress=document.querySelector('#progress'),goodTrace=document.querySelector('#goodTrace'),badTrace=document.querySelector('#badTrace'),
startBtn=document.querySelector('#start'),resetBtn=document.querySelector('#reset'),coach=document.querySelector('#coach'),
statusEl=document.querySelector('#status'),badge=document.querySelector('#badge'),demoTab=document.querySelector('#demoTab'),
practiceTab=document.querySelector('#practiceTab'),words=[...document.querySelectorAll('.word')].filter(x=>!x.classList.contains('punct'));
let ctx,analyser,stream,buf,raf,running=false,mode='ready',t0=0,lastFrame=0,voicedMs=0,smooth=null,last=null;
let baselineSamples=[],traceGood=[],traceBad=[],lastWasGood=null;
const demoDuration=6500, practiceVoicedDuration=5600;

function hzMidi(h){return 69+12*Math.log2(h/440)}
function ac(b,sr){let rms=0;for(let v of b)rms+=v*v;rms=Math.sqrt(rms/b.length);if(rms<.014)return-1;
 let min=Math.floor(sr/480),max=Math.min(Math.floor(sr/75),b.length-2),best=-1,score=0;
 for(let lag=min;lag<=max;lag++){let c=0,n=b.length-lag;for(let i=0;i<n;i++)c+=b[i]*b[i+lag];c/=n;if(c>score){score=c;best=lag}}
 if(best<0)return-1;let norm=0,n=b.length-best;for(let i=0;i<n;i++)norm+=(b[i]*b[i]+b[i+best]*b[i+best])*.5;norm/=n;
 return norm>0&&score/norm>.57?sr/best:-1}
function point(t){let len=road.getTotalLength(),p=road.getPointAtLength(len*Math.max(0,Math.min(1,t)));return{x:p.x,y:p.y}}
function cssPoint(t){let p=point(t);return{x:p.x/10,y:p.y/6}}
function setWord(t){let i=Math.min(words.length-1,Math.floor(t*words.length));words.forEach((w,j)=>w.classList.toggle('active',j===i))}
function median(a){let b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]}
function pathString(arr){return arr.length?arr.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' '):''}
function clearTrace(){traceGood=[];traceBad=[];goodTrace.setAttribute('d','');badTrace.setAttribute('d','');lastWasGood=null}

function ready(){
 if('speechSynthesis' in window)speechSynthesis.cancel();
 running=false;cancelAnimationFrame(raf);mode='ready';words.forEach(w=>w.classList.remove('active'));clearTrace();
 let p=cssPoint(0);dragon.style.display='grid';panda.style.display='none';dragon.style.left=p.x+'%';dragon.style.top=p.y+'%';
 progress.style.strokeDasharray='100';progress.style.strokeDashoffset='100';
 demoTab.classList.add('on');practiceTab.classList.remove('on');badge.textContent='先听示范';
 statusEl.textContent='看小龙怎么走';coach.textContent='第一步：小龙会沿蓝色目标轨迹示范整句话。';
 startBtn.disabled=false;startBtn.textContent='▶️ 小龙先示范';
}
function demoLoop(now){
 if(!running||mode!=='demo')return;
 let t=Math.min(1,(now-t0)/demoDuration),p=cssPoint(t);
 dragon.style.left=p.x+'%';dragon.style.top=p.y+'%';progress.style.strokeDashoffset=String(100-t*100);setWord(t);
 statusEl.textContent=t<1?'🐲 跟着蓝线听高低变化':'示范完成';
 if(t>=1){running=false;words.forEach(w=>w.classList.remove('active'));coach.textContent='现在轮到你：说「你好，我叫小马。」熊猫会画出你的真实轨迹。';
   startBtn.disabled=false;startBtn.textContent='🎙️ 轮到我练习';badge.textContent='轮到你了';return}
 raf=requestAnimationFrame(demoLoop);
}
function chooseChineseVoice(){
 const vs=speechSynthesis.getVoices();
 return vs.find(v=>/^zh-CN/i.test(v.lang)) ||
        vs.find(v=>/^zh/i.test(v.lang)) || null;
}
function speakDemo(){
 if(!('speechSynthesis' in window))return false;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance('你好，我叫小马。');
 u.lang='zh-CN';
 u.rate=.78;
 u.pitch=1.02;
 const v=chooseChineseVoice(); if(v)u.voice=v;
 u.onerror=()=>{document.querySelector('#voiceNote').textContent='🔊 当前浏览器没有成功播放中文语音，但仍可继续轨迹练习。'};
 speechSynthesis.speak(u);
 return true;
}
function startDemo(){
 // Browser speech is started directly from the click, which is important on mobile Chrome.
 speakDemo();
 mode='demo';running=true;t0=performance.now();demoTab.classList.add('on');practiceTab.classList.remove('on');
 startBtn.disabled=true;startBtn.textContent='小龙示范中…';coach.textContent='听小龙说整句话，同时看蓝线的高低起伏。';raf=requestAnimationFrame(demoLoop)}

async function startPractice(){
 try{
  if(!stream){stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
   ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();let src=ctx.createMediaStreamSource(stream);
   analyser=ctx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);buf=new Float32Array(analyser.fftSize)}
  mode='practice';running=true;voicedMs=0;lastFrame=0;smooth=last=null;baselineSamples=[];clearTrace();
  dragon.style.display='none';panda.style.display='grid';let p=cssPoint(0);panda.style.left=p.x+'%';panda.style.top=p.y+'%';
  progress.style.strokeDashoffset='100';demoTab.classList.remove('on');practiceTab.classList.add('on');badge.textContent='● 正在听';
  coach.textContent='连续说整句话。绿色＝接近蓝线；红色＝需要调整。';startBtn.disabled=true;startBtn.textContent='正在聆听…';
  raf=requestAnimationFrame(practiceLoop);
 }catch(e){badge.textContent='麦克风未开启';coach.textContent='请允许浏览器使用麦克风后再试。'}
}
function practiceLoop(now){
 if(!running||mode!=='practice')return;if(!lastFrame)lastFrame=now;let dt=Math.min(80,now-lastFrame);lastFrame=now;
 analyser.getFloatTimeDomainData(buf);let h=ac(buf,ctx.sampleRate);
 if(h>0){
  voicedMs+=dt;let t=Math.min(1,voicedMs/practiceVoicedDuration),target=point(t),m=hzMidi(h);
  if(last!==null&&Math.abs(m-last)>6)m=last;last=m;smooth=smooth===null?m:smooth*.91+m*.09;
  if(baselineSamples.length<45)baselineSamples.push(smooth);
  let ref=median(baselineSamples.length?baselineSamples:[smooth]);
  // Convert relative semitone movement to screen position. Wide tolerance on purpose.
  let userY=300-(smooth-ref)*38;
  // Gradually anchor the user's personal range to the sentence road, without forcing exact tracing.
  let anchor=target.y; userY=anchor*.72+userY*.28;
  userY=Math.max(75,Math.min(525,userY));
  let diff=Math.abs(userY-target.y),good=diff<=62; // broad corridor
  let q={x:target.x,y:userY};
  // Keep separate colored segments so bad regions are visibly red.
  if(good){if(lastWasGood===false&&traceBad.length)traceGood.push(traceBad[traceBad.length-1]);traceGood.push(q)}
  else{if(lastWasGood===true&&traceGood.length)traceBad.push(traceGood[traceGood.length-1]);traceBad.push(q)}
  lastWasGood=good;goodTrace.setAttribute('d',pathString(traceGood));badTrace.setAttribute('d',pathString(traceBad));
  panda.style.left=(target.x/10)+'%';panda.style.top=(userY/6)+'%';progress.style.strokeDashoffset=String(100-t*100);setWord(t);
  statusEl.textContent=good?'✓ 很接近':'调整到蓝线';
  if(t>=1){running=false;words.forEach(w=>w.classList.remove('active'));badge.textContent='完成 ✓';
    let total=traceGood.length+traceBad.length,ratio=total?traceGood.length/total:0;
    coach.textContent=ratio>.7?'很好！大部分声音轨迹都贴近蓝色目标。':'完成了！看看红色部分，就是下一次最值得调整的位置。';
    startBtn.disabled=false;startBtn.textContent='🎙️ 再练一次';return}
 }else statusEl.textContent='等你开口…';
 raf=requestAnimationFrame(practiceLoop);
}
startBtn.onclick=()=>{if(mode==='ready')startDemo();else startPractice()};
resetBtn.onclick=ready;ready();
</script>
</body></html>
