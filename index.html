<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Tone Game — Magic Moment</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}.app{width:min(100%,520px);background:#fff;border-radius:28px;padding:22px;box-shadow:0 18px 55px rgba(23,33,43,.12)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{font-size:13px;padding:7px 10px;border-radius:999px;background:#eef2ff}.word{text-align:center;margin:12px 0 2px;font-size:54px;font-weight:800}.pinyin{text-align:center;font-size:23px;font-weight:700}.hint{text-align:center;color:#667085;margin:5px 0 16px}.game{position:relative;height:330px;border-radius:24px;overflow:hidden;background:linear-gradient(#edf8ff,#f7fbff 55%,#eef9ef);border:1px solid #e5e7eb}.grid{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 24%,rgba(23,33,43,.06) 25%,transparent 26%,transparent 49%,rgba(23,33,43,.06) 50%,transparent 51%,transparent 74%,rgba(23,33,43,.06) 75%,transparent 76%)}svg{position:absolute;inset:0;width:100%;height:100%}.lane{fill:none;stroke:#c7d2fe;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}.laneCore{fill:none;stroke:#6475e8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 8}.trace{fill:none;stroke:#111827;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.panda{position:absolute;left:12%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:white;box-shadow:0 6px 18px rgba(0,0,0,.16);transition:top .045s linear,left .045s linear}.status{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:rgba(255,255,255,.92);padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}.meter{display:flex;justify-content:space-between;margin:12px 2px 0;color:#667085;font-size:13px}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}button{appearance:none;border:0;border-radius:16px;padding:15px 18px;font-size:17px;font-weight:800;cursor:pointer}.primary{background:#17212b;color:#fff}.secondary{background:#eef2f6;color:#17212b}.feedback{min-height:52px;margin-top:14px;padding:13px 14px;border-radius:16px;background:#f7f8fa;font-size:15px;line-height:1.45}.privacy{text-align:center;color:#98a2b3;font-size:12px;margin-top:12px}.small{font-size:12px;color:#667085}.live{background:#ecfdf3;color:#067647}.warn{background:#fff7ed;color:#b54708}@media(max-width:390px){.app{padding:16px;border-radius:22px}.game{height:300px}.word{font-size:48px}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><strong>声调大冒险</strong><span id="micBadge" class="badge">🎙️ 麦克风未启动</span></div>
  <div class="word">马</div><div class="pinyin">mǎ · 第三声</div>
  <div class="hint">熊猫向前跑；你的音高控制它上下移动 ∨</div>
  <section class="game" id="game">
    <div class="grid"></div>
    <svg viewBox="0 0 1000 600" preserveAspectRatio="none" aria-label="第三声目标轨道">
      <path class="lane" d="M120 180 C330 205 430 430 560 440 C710 450 800 260 930 180"/>
      <path class="laneCore" d="M120 180 C330 205 430 430 560 440 C710 450 800 260 930 180"/>
      <polyline id="trace" class="trace" points=""/>
    </svg>
    <div id="status" class="status">点击开始，然后说「mǎ」</div>
    <div id="panda" class="panda">🐼</div>
  </section>
  <div class="meter"><span id="pitchText">音高：—</span><span id="directionText">变化：—</span></div>
  <div class="actions"><button id="startBtn" class="primary">🎙️ 开始练习</button><button id="resetBtn" class="secondary">重新开始</button></div>
  <div id="feedback" class="feedback"><strong>目标：</strong>说「mǎ——」时，熊猫会向前移动，并把你的真实音高画成一条轨迹。</div>
  <div class="privacy">🔒 声音在你的浏览器里分析，本页面不会上传录音。</div>
</main>
<script>
const panda=document.getElementById('panda'), startBtn=document.getElementById('startBtn'), resetBtn=document.getElementById('resetBtn'), micBadge=document.getElementById('micBadge'), pitchText=document.getElementById('pitchText'), directionText=document.getElementById('directionText'), feedback=document.getElementById('feedback'), statusEl=document.getElementById('status'), traceEl=document.getElementById('trace');
let audioCtx, analyser, stream, raf, buffer, running=false, smoothMidi=null, history=[], startTime=0, voicedFrames=0, baseMidi=null;
function hzToMidi(hz){return 69+12*Math.log2(hz/440)}
function autoCorrelate(buf,sampleRate){let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/buf.length);if(rms<0.012)return -1;let minLag=Math.floor(sampleRate/500),maxLag=Math.min(Math.floor(sampleRate/70),buf.length-2),bestLag=-1,best=0;for(let lag=minLag;lag<=maxLag;lag++){let c=0,n=buf.length-lag;for(let i=0;i<n;i++)c+=buf[i]*buf[i+lag];c/=n;if(c>best){best=c;bestLag=lag}}if(bestLag<0)return -1;let norm=0;for(let i=0;i<buf.length-bestLag;i++)norm+=(buf[i]*buf[i]+buf[i+bestLag]*buf[i+bestLag])*.5;norm/=buf.length-bestLag;if(norm<=0||best/norm<.55)return -1;return sampleRate/bestLag}
function targetY(t){ if(t<.52){let u=t/.52;return .28+.48*(u*u*(3-2*u))} let u=(t-.52)/.48;return .76-.48*(u*u*(3-2*u)) }
function reset(){history=[];smoothMidi=null;baseMidi=null;voicedFrames=0;startTime=performance.now();panda.style.left='12%';panda.style.top='28%';traceEl.setAttribute('points','');feedback.innerHTML='<strong>目标：</strong>先下降到低点，再自然地升回来。';statusEl.textContent='准备好就说「mǎ」';}
function evaluate(){
  if(history.length<10)return;
  let ys=history.map(x=>x.y);
  let lowPitchY=Math.max(...ys); // screen lower = pitch lower
  let lowIndex=ys.indexOf(lowPitchY);
  let pos=lowIndex/(ys.length-1);
  let startY=ys.slice(0,Math.min(5,ys.length)).reduce((a,b)=>a+b,0)/Math.min(5,ys.length);
  let endY=ys.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,ys.length);
  let fell=lowPitchY-startY>.10;
  let rose=lowPitchY-endY>.10;
  let valley=pos>.28&&pos<.78;
  if(fell&&rose&&valley){statusEl.textContent='✨ 命中！就是这个感觉';feedback.innerHTML='<strong>很好！</strong> 熊猫真的走出了“先降、再升”的第三声轨迹。';}
  else if(!fell){statusEl.textContent='差一点';feedback.innerHTML='<strong>只改一件事：</strong> 让熊猫先往谷底走 ↓';}
  else if(!rose){statusEl.textContent='差一点';feedback.innerHTML='<strong>只改一件事：</strong> 到谷底后，把熊猫带回来 ↗';}
  else{statusEl.textContent='很接近了';feedback.innerHTML='<strong>只改一件事：</strong> 稍晚一点到达最低点，再往上。';}
}
function loop(){
  if(!running)return;
  analyser.getFloatTimeDomainData(buffer);
  let hz=autoCorrelate(buffer,audioCtx.sampleRate);
  if(hz>0){
    let midi=hzToMidi(hz);
    smoothMidi=smoothMidi==null?midi:(smoothMidi*.76+midi*.24);
    if(baseMidi==null) baseMidi=smoothMidi;
    let elapsed=(performance.now()-startTime)/3600;
    let x=Math.max(.12,Math.min(.93,.12+elapsed*.81));
    // Pitch is relative to the user's own starting pitch, not absolute Hz.
    // Lower voice moves panda down; higher voice moves panda up.
    let delta=smoothMidi-baseMidi;
    let y=Math.max(.08,Math.min(.92,.28-delta/12));
    history.push({m:smoothMidi,y,x});
    panda.style.left=(x*100)+'%';
    panda.style.top=(y*100)+'%';
    pitchText.textContent='音高：'+Math.round(hz)+' Hz';
    let prev=history[Math.max(0,history.length-6)];
    let d=smoothMidi-prev.m;
    directionText.textContent='变化：'+(d>.18?'↗ 上升':d<-.18?'↘ 下降':'→ 平稳');
    traceEl.setAttribute('points',history.map(p=>(p.x*1000)+','+(p.y*600)).join(' '));
    voicedFrames++;
    if(elapsed>=1){
      evaluate();
      running=false;
      startBtn.disabled=false;
      startBtn.textContent='🎙️ 再说一次';
      micBadge.textContent='✓ 本次完成';
      micBadge.className='badge';
      return;
    }
  }
  raf=requestAnimationFrame(loop);
}
async function start(){
  try{
    if(!stream){
      if(!navigator.mediaDevices?.getUserMedia)throw new Error('browser');
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      await audioCtx.resume();
      let src=audioCtx.createMediaStreamSource(stream);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
      buffer=new Float32Array(analyser.fftSize);
    }
    reset(); running=true;
    micBadge.textContent='● 麦克风工作中'; micBadge.className='badge live';
    startBtn.textContent='正在聆听…'; startBtn.disabled=true;
    statusEl.textContent='现在说「mǎ——」';
    loop();
  }catch(e){
    micBadge.textContent='麦克风无法启动'; micBadge.className='badge warn';
    feedback.innerHTML='<strong>没有拿到麦克风权限。</strong> 请用 Chrome / Safari 打开，并允许这个网页使用麦克风。';
  }
}
startBtn.addEventListener('click',start);resetBtn.addEventListener('click',()=>{running=false;cancelAnimationFrame(raf);reset();startBtn.disabled=false;startBtn.textContent='🎙️ 开始练习';});
</script>
</body>
</html>
